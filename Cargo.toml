[package]
name = "oxideav-pdf"
version = "0.1.1"
edition = "2021"
rust-version = "1.80"
license = "MIT"
authors = ["Mark Karpeles"]
description = "Pure-Rust PDF writer for the oxideav framework — vector-stays-vector path"
repository = "https://github.com/OxideAV/oxideav-pdf"
homepage = "https://github.com/OxideAV/oxideav-pdf"
readme = "README.md"
keywords = ["multimedia", "pdf", "vector", "writer", "pure-rust"]
categories = ["multimedia::encoding"]

[dependencies]
oxideav-core = "0.1"
# Scene model — round 2 adds multi-page output via `Scene::pages` and
# scene-level `Metadata` plumbing into the PDF `/Info` dictionary. The
# `default-features = false` cut drops the `raster` feature (and its
# `oxideav-raster` transitive) — PDF is a vector-target writer and
# never rasterises, so we don't need the raster fallback.
oxideav-scene = { version = "0.1", default-features = false }
# Pure-Rust DEFLATE for FlateDecode-compressed content streams and
# embedded RGBA image XObjects. Same crate the wider workspace already
# uses (oxideav-png pulls in miniz_oxide; flate2 is the higher-level
# wrapper crate that ships pure-Rust miniz_oxide as its default backend
# — see flate2's `rust_backend` feature, which is on by default).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Pure-Rust AES (RustCrypto). Round-4 reader uses AES-128/256 in CBC
# mode for ISO 32000-1 §7.6 standard-handler decryption (R=4 / R=5 /
# R=6). The `aes` crate is a pure-Rust constant-time implementation
# from the RustCrypto project — no `*-sys` wrapper, no external C.
# The CBC mode wrapper is split into the companion `cbc` crate.
aes = { version = "0.8", default-features = false }
cbc = { version = "0.1", default-features = false, features = ["block-padding"] }
# Pure-Rust SHA-256 / SHA-384 / SHA-512 (RustCrypto). Round-5 reader
# uses SHA-256 for R=5 password derivation (Adobe extension level 3)
# and the full SHA-256/384/512 set for R=6 Algorithm 2.B (ISO
# 32000-2:2020 §7.6.4.4.3) — the hash chain alternates between the
# three depending on a running modulus byte. The `sha2` crate is
# pure-Rust + constant-time; it shares the `digest` trait surface
# already pulled in transitively by the AES cipher dep.
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
# Pure-Rust SHA-1 (RustCrypto). Round-10 public-key handler uses
# SHA-1 over `seed ‖ recipient_blobs [‖ 0xFFFFFFFF]` for
# `adbe.pkcs7.s3` and `adbe.pkcs7.s4` (ISO 32000-1 §7.6.4.3) — and
# also for the legacy SHA-1 digest of the AES-128 key derivation
# in `adbe.pkcs7.s5`. SHA-1 is broken for collision attacks but
# the spec mandates it for these subfilters; SHA-256 is only used
# for the ISO 32000-2 AES-256 path.
sha1 = { version = "0.10", default-features = false, features = ["oid"] }
# Pure-Rust RSA (RustCrypto). Round-10 public-key handler unwraps
# the CMS RecipientInfo encrypted content-encryption key using
# RSAES-PKCS1-v1_5 (the only key-encryption algorithm OID we need
# for `adbe.pkcs7.s3`/`s4`/`s5` per RFC 5652 + ISO 32000-1 §7.6.4).
# The crate is pure-Rust on top of `num-bigint-dig`; no `*-sys`.
# `std` is needed for `OsRng` (used by tests + by the encoder side
# in round 11) and for the `pkcs8` feature's PKCS#8 PEM/DER reader.
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
# Pure-Rust NIST P-256 (secp256r1) curve (RustCrypto). Round-14 KARI
# unwrap uses ECDH key agreement on P-256 — the most common curve in
# Adobe + standard-PDF tools' enveloped data. The `ecdh` feature
# enables the diffie_hellman primitive that produces the shared
# secret `Z`. The crate is constant-time pure-Rust on top of
# `elliptic-curve`; no `*-sys`.
p256 = { version = "0.13", default-features = false, features = [
    "ecdh",
    "ecdsa",
    "std",
] }
# Pure-Rust NIST P-384 (secp384r1) curve (RustCrypto). Round-15
# extends KARI unwrap + write to P-384 ECDH bound to the X9.63
# SHA-384 KDF per RFC 5753 §7.1.4 (`dhSinglePass-stdDH-sha384kdf-scheme`,
# OID 1.3.132.1.11.2). Same family + API as `p256`.
p384 = { version = "0.13", default-features = false, features = [
    "ecdh",
    "ecdsa",
    "std",
] }
# Pure-Rust NIST P-521 (secp521r1) curve (RustCrypto). Round-16 closes
# the NIST KARI curve coverage by binding P-521 ECDH to the X9.63
# SHA-512 KDF per RFC 5753 §7.1.4 (`dhSinglePass-stdDH-sha512kdf-scheme`,
# OID 1.3.132.1.11.3). Same family + API as `p256` / `p384`.
p521 = { version = "0.13", default-features = false, features = [
    "ecdh",
    "ecdsa",
    "getrandom",
    "std",
] }
# Pure-Rust HKDF (RustCrypto). Round-16 wires the RFC 8418 §2.2 HKDF
# binding for X25519 — `dhSinglePass-stdDH-hkdf-sha256/384/512-scheme`
# (smime-alg 19 / 20 / 21, OIDs 1.2.840.113549.1.9.16.3.{19,20,21}).
# HKDF replaces X9.63 as the modern KDF for the same KEK derivation
# slot: salt = ukm (or empty), IKM = ECDH shared secret, info = DER
# ECC-CMS-SharedInfo, output truncated to the wrap KEK length.
hkdf = { version = "0.12", default-features = false }
# Pure-Rust X25519 ECDH (dalek-cryptography). Round-15 adds the X25519
# KARI variant per RFC 8418 §2.1 (CMS uses ANSI-X9.63 KDF over X25519
# with the secg-scheme OIDs in the same `1.3.132.1.11.x` family that
# RFC 5753 defines for the NIST curves; the `id-X25519` OID 1.3.101.110
# names the curve inside the OriginatorPublicKey AlgorithmIdentifier).
# `static_secrets` enables `StaticSecret::from([u8; 32])` used by both
# the unwrap and the writer-side ephemeral derivation paths.
x25519-dalek = { version = "2", default-features = false, features = [
    "static_secrets",
] }
# Pure-Rust AES Key Wrap (RustCrypto). Round-14 KARI unwrap uses
# RFC 3394 AES-KW (AES-128 / AES-192 / AES-256) to unwrap the CEK
# from the bytes the KDF-derived KEK + the wrapped octets in the
# recipient slot. See `dhSinglePass-stdDH-sha*kdf-scheme` (RFC 5753
# §7.1) — its `parameters` is the AlgorithmIdentifier of the wrap.
# `alloc` enables the `wrap_vec` / `unwrap_vec` Vec-returning helpers
# (the lower-level `wrap` / `unwrap` API requires a pre-sized output
# buffer; the Vec helpers are simpler at the call site).
aes-kw = { version = "0.2", features = ["alloc"] }
# Pure-Rust RC2 block cipher (RustCrypto). Round-17 adds read-only
# CMS envelope decode for `EncryptedContentInfo.contentEncryptionAlgorithm
# = rc2-cbc` (OID 1.2.840.113549.3.2) per RFC 3217. PDF 2.0 deprecates
# RC2 but legacy archives still ship envelopes with it; we accept on
# decode only (no encode-side support). RC2 is broken cryptographically
# (RFC 3217 only defined for backward compat); we surface it so legacy
# files open. The `cbc` wrapper crate is shared with the AES path.
rc2 = { version = "0.8", default-features = false }
# Pure-Rust DES / 3DES (TDEA) block cipher (RustCrypto). Round-17 adds
# read-only CMS envelope decode for `des-EDE3-CBC` (OID 1.2.840.113549.3.7)
# per RFC 3211 / RFC 5652 §12.4. PDF 2.0 deprecates 3DES — we accept on
# decode only. The `cbc` wrapper crate is shared with the AES path.
des = { version = "0.8", default-features = false }
